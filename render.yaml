# =====================================================================
# NEXFIBER - Despliegue Unificado en Render (Monorepositorio)
# Documentacion: https://render.com/docs/blueprint-spec
#
# Uso:
#   1. Sube el repositorio a GitHub: emmanuelmejias196-tech/nexfiber
#   2. En Render: New > Blueprint > selecciona el repositorio.
#   3. Render lee este archivo, conecta la base de datos PostgreSQL,
#      el Backend API, la Consola Web y los servicios POS automáticamente.
# =====================================================================

databases:
  - name: cable-tartak-db
    databaseName: cable_tartak
    user: tartak
    plan: free
    postgresMajorVersion: "16"

services:
  # 1. API Troncal de NEXFIBER (Node.js + Express + PostgreSQL)
  - type: web
    name: cable-tartak-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: .
    buildCommand: npm --prefix backend ci --omit=dev && npm --prefix backend run migrate
    startCommand: node backend/src/server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: APP_VERSION
        value: 1.0.0
      - key: LOG_LEVEL
        value: info
      - key: MIGRATE_ON_BOOT
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: cable-tartak-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ISSUER
        value: nexfiber-api
      - key: JWT_ACCESS_TTL
        value: 1800
      - key: REFRESH_TOKEN_TTL_DAYS
        value: 30
      - key: BCRYPT_ROUNDS
        value: 12
      - key: ACTIVATION_REQUIRES_OTP
        value: "false"
      - key: ADMIN_API_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: RATE_LIMIT_GLOBAL
        value: 600
      - key: RATE_LIMIT_AUTH
        value: 10
      - key: RATE_LIMIT_WRITE
        value: 60
      - key: PASSWORD_MIN_LENGTH
        value: 6
      - key: C2P_REQUIRE_SIGNATURE
        value: "false"
      - key: C2P_SIGNATURE_SECRET
        generateValue: true

  # 2. Consola Web Administrativa y Portal de Clientes NEXFIBER (React 18 + Node)
  - type: web
    name: nexfiber-web
    runtime: node
    plan: free
    region: frankfurt
    rootDir: web
    buildCommand: npm ci && npm run build
    startCommand: node server/index.mjs
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: CABLE_TARTAK_DB
        value: /tmp/cable-tartak.sqlite

  # 3. Servicio Backend POS en Tiempo Real (Node + Firebase)
  - type: web
    name: nexfiber-pos-api
    runtime: node
    plan: free
    region: virginia
    rootDir: services/pos-virgen-del-valle
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: "10000"
      - key: NODE_ENV
        value: production
      - key: APP_URL
        value: "https://nexfiber-pos-web.onrender.com"
      - key: CORS_ORIGIN
        value: "https://nexfiber-pos-web.onrender.com,http://localhost:3000,http://localhost:5173,https://localhost"
      - key: OWNER_NAME
        sync: false
      - key: OWNER_PHONE
        sync: false
      - key: OWNER_EMAIL
        sync: false

  # 4. Portal Web POS PWA (Vite + React 19)
  - type: static
    name: nexfiber-pos-web
    rootDir: services/pos-virgen-del-valle
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    region: virginia
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

